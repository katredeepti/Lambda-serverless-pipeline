AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: LambdaCode
Resources:
  LambdaCode:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: lambda_function.lambda_handler
      Runtime: python3.6
      CodeUri: ./LambdaCode
      Description: 'LambdaCode'
      MemorySize: 256
      Timeout: 30
      Role: 'arn:aws:iam::992014891278:role/lambda-ec2'
      Events:
        getAZsAPI:
          Type: Api
          Properties:
            Path: /getazs
            Method: get
      Environment:
        Variables:
          REGION: us-east-2
      jobs:
        - job_name: sql_servers
          collectors: [mssql_lime, mssql_standard]
          enable_ping: true
          static_configs:
          - targets:
            sql-server-1: 'sqlserver:xyz'
          labels:
            environment: dev
            datacenter: eu-north-1
 
 
